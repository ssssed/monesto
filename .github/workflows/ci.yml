# PR: сначала правила заголовка/описания/ветки, затем lint, типы, сборка, тесты.
# Push в main/master: только проверки кода (без контекста PR).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Проверка названия PR, ветки и описания
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;
            const title = pr.title.trim();
            const rawBody = pr.body ?? "";
            const bodyWithoutComments = rawBody.replace(/<!--[\s\S]*?-->/g, "").trim();

            if (headRef.startsWith("dependabot/")) {
              core.info("Пропуск: ветка dependabot.");
              return;
            }

            const kinds = ["release", "fix", "feature", "crit", "hotfix"];
            const kindsAlt = kinds.join("|");

            const branchRe = new RegExp(`^(${kindsAlt})\\/.+$`);
            if (!branchRe.test(headRef)) {
              core.setFailed(
                [
                  "Неверное имя ветки.",
                  `Ожидается: <${kindsAlt}>/<название> (латиница, kebab-case, без пробелов).`,
                  `Текущая ветка: ${headRef}`,
                ].join("\n")
              );
              return;
            }

            const branchSlugMatch = headRef.match(new RegExp(`^(${kindsAlt})\\/(.+)$`));
            const branchKind = branchSlugMatch[1];
            const branchSlug = branchSlugMatch[2];

            // release/<slug> — двоеточие с описанием опционально.
            // fix|feature|crit|hotfix/<slug>: <описание> — двоеточие с описанием обязательно.
            const titleRe =
              branchKind === "release"
                ? new RegExp(`^release\\/([^:]+)(?::\\s+\\S.*)?$`)
                : new RegExp(`^(${kindsAlt})\\/([^:]+):\\s+\\S.*$`);
            const titleMatch = title.match(titleRe);
            if (!titleMatch) {
              const example =
                branchKind === "release"
                  ? "release/<slug> (опционально: release/<slug>: <короткое описание>)"
                  : `${branchKind}/<slug>: <короткое описание>`;
              core.setFailed(
                [
                  "Неверный заголовок PR.",
                  `Ожидается: ${example}`,
                  branchKind === "release"
                    ? "Если указано двоеточие — после него обязательны пробел и текст описания."
                    : "После двоеточия обязательны пробел и текст описания.",
                  `Текущий заголовок: ${title}`,
                ].join("\n")
              );
              return;
            }

            const titleKind = branchKind === "release" ? "release" : titleMatch[1];
            const titleSlug = branchKind === "release" ? titleMatch[1] : titleMatch[2];
            if (titleKind !== branchKind || titleSlug !== branchSlug) {
              core.setFailed(
                [
                  "Префикс и slug в заголовке PR должны совпадать с веткой.",
                  `Ветка: ${headRef} → ожидается заголовок, начинающийся с: ${branchKind}/${branchSlug}`,
                  `Сейчас заголовок: ${title}`,
                ].join("\n")
              );
              return;
            }

            core.info("Проверки PR: OK.");

  pr-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Сборка описания PR из коммитов
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;

            if (headRef.startsWith("dependabot/")) {
              core.info("Пропуск: ветка dependabot.");
              return;
            }

            // Секции по типу коммита (Conventional Commits: "type(scope): текст").
            // Порядок массива — порядок секций в итоговом описании.
            const typeSections = [
              { types: ["feat", "feature"], title: "Добавлено" },
              { types: ["fix"], title: "Исправлено" },
              { types: ["perf"], title: "Производительность" },
              { types: ["refactor"], title: "Изменено" },
              { types: ["release"], title: "Релиз" },
              { types: ["docs"], title: "Документация" },
              { types: ["style"], title: "Стили" },
              { types: ["test"], title: "Тесты" },
              { types: ["build", "ci"], title: "Сборка/CI" },
              { types: ["revert"], title: "Откат" },
              { types: ["chore"], title: "Прочее" },
            ];

            const typeToSection = new Map();
            for (const section of typeSections) {
              for (const type of section.types) {
                typeToSection.set(type, section.title);
              }
            }

            const commitRe = /^(\w+)(?:\(([^)]*)\))?!?:\s*(.+)$/;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const grouped = new Map();
            const other = [];
            const seen = new Set();

            for (const c of commits) {
              const subject = c.commit.message.split("\n")[0].trim();
              if (!subject || subject.startsWith("Merge ")) continue;
              if (seen.has(subject)) continue;
              seen.add(subject);

              const match = subject.match(commitRe);
              if (!match) {
                other.push(subject);
                continue;
              }

              const [, type, , text] = match;
              const sectionTitle = typeToSection.get(type.toLowerCase());
              if (!sectionTitle) {
                other.push(subject);
                continue;
              }

              if (!grouped.has(sectionTitle)) grouped.set(sectionTitle, []);
              grouped.get(sectionTitle).push(text.trim());
            }

            const lines = [];
            for (const section of typeSections) {
              const items = grouped.get(section.title);
              if (!items || items.length === 0) continue;
              lines.push(`## ${section.title}`, "");
              for (const item of items) lines.push(`- ${item}`);
              lines.push("");
            }

            if (other.length > 0) {
              lines.push("## Прочие изменения", "");
              for (const item of other) lines.push(`- ${item}`);
              lines.push("");
            }

            if (lines.length === 0) {
              lines.push("_Нет коммитов для описания._");
            }

            const marker = "<!-- auto-generated-pr-description -->";
            const body = [marker, "", ...lines].join("\n").trimEnd() + "\n";

            if ((pr.body ?? "").trim() === body.trim()) {
              core.info("Описание PR уже актуально.");
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body,
            });

            core.info("Описание PR обновлено из коммитов.");

  verify:
    needs: pr-conventions
    if: |
      always() &&
      (needs.pr-conventions.result == 'success' || needs.pr-conventions.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Секреты в репозитории: WEBAPP_<имя переменной как в .env> → строка в apps/webapp/.env
      # (сейчас: WEBAPP_PUBLIC_* — см. apps/webapp/.env.example).
      # Нужны до typecheck/build: svelte-kit sync читает .env и генерирует типы $env/static/public.
      - name: Webapp .env из GitHub Secrets
        env:
          PUBLIC_API_URL: ${{ secrets.WEBAPP_PUBLIC_API_URL }}
          PUBLIC_TEST_TOKEN: ${{ secrets.WEBAPP_PUBLIC_TEST_TOKEN }}
          PUBLIC_BOT_URL: ${{ secrets.WEBAPP_PUBLIC_BOT_URL }}
          PUBLIC_BOT_NAME: ${{ secrets.WEBAPP_PUBLIC_BOT_NAME }}
        run: |
          set -e
          umask 077
          printf '%s\n' \
            "PUBLIC_API_URL=${PUBLIC_API_URL}" \
            "PUBLIC_TEST_TOKEN=${PUBLIC_TEST_TOKEN}" \
            "PUBLIC_BOT_URL=${PUBLIC_BOT_URL}" \
            "PUBLIC_BOT_NAME=${PUBLIC_BOT_NAME}" \
            > apps/webapp/.env

      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run check-types

      - name: Build
        run: npx turbo run build

      - name: Test (@monesto/cli)
        run: npm run test -w @monesto/cli -- --run
